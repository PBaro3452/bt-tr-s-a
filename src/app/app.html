<div class="shop-shell">
  <header class="shop-header">
    <p class="shop-subtitle">Menu trà sữa</p>
    <h1>{{ title() }}</h1>
    <h2>{{ ShopName() }}</h2>
  </header>

  <div class="drink-choice-group" role="group" aria-label="Chọn món">
  @for(nut of thucuong(); track nut.id ){
    <button class="choice-btn" (click)="drinks.set(nut)">@if(nut.isFavorite){<span aria-label="món yêu thích">🔥</span>}{{ nut
.name }}@if(nut.giaCoBan === giaCaoNhat()){ <span aria-label="món đắt nhất">💎</span> }</button>
  }
  
  </div>

  <app-drink-detail [drinks]="drinks()"></app-drink-detail>
</div>
